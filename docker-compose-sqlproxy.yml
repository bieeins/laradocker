services:
    ####################################################################################################
    # PHP
    ####################################################################################################
    php:
        build: .docker/php
        volumes:
            - .application:/var/www:cached
        networks:
            - backend
        environment:
            - PHP_FPM_PORT=9000
            - DB_CONNECTION=mysql
            - DB_HOST=sql-proxy
            - DB_PORT=3306
            - DB_DATABASE=laravel
            - DB_USERNAME=root
            - DB_PASSWORD=secret
            - DB_WRITE_HOST=sql-proxy
            - DB_READ_HOST=sql-proxy
        deploy:
            replicas: 3
            update_config:
                parallelism: 1
            restart_policy:
                condition: on-failure

    ####################################################################################################
    # Nginx
    ####################################################################################################
    nginx:
        image: nginx
        ports:
            - 11001:80
        volumes:
            - .application:/var/www
            - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - php
        networks:
            - frontend
            - backend

    ####################################################################################################
    # HAProxy
    ####################################################################################################
    haproxy:
        image: haproxy:latest
        ports:
            - 8404:8404
            - 3306:3306  # MySQL Write Proxy
            - 3307:3307  # MySQL Read Proxy
            - 9000:9000  # HAProxy stats
        volumes:
            - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
        networks:
            - frontend
            - backend
        depends_on:
            - php
            - db
            - slave1
            - slave2

    ####################################################################################################
    # DATABASE (Mariadb) REPLIKA
    ####################################################################################################
    db:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: db_laradoc
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/master:/var/log/mysql/
            - .docker/db/db_master_data:/var/lib/mysql
            - .docker/mysql/master/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/master:/docker-entrypoint-initdb.d
        networks:
            - backend

    slave1:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/slave1:/var/log/mysql
            - .docker/db/db_slave1_data:/var/lib/mysql
            - .docker/mysql/slave1/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/slave1:/docker-entrypoint-initdb.d
        networks:
            - backend
        depends_on:
            - db

    slave2:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/slave2:/var/log/mysql
            - .docker/db/db_slave2_data:/var/lib/mysql
            - .docker/mysql/slave2/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/slave2:/docker-entrypoint-initdb.d
        networks:
            - backend
        depends_on:
            - db

    ####################################################################################################
    # SQL Proxy
    ####################################################################################################
    sql-proxy:
        image: gcr.io/cloudsql-docker/gce-proxy:latest
        command: >
            /cloud_sql_proxy 
            -instances=${INSTANCE_CONNECTION_NAME}=tcp:0.0.0.0:3306 
            -credential_file=/credentials/credentials.json
        ports:
            - 3306:3306
            - 3307:3307
        environment:
            - DB_USER=db_user
            - DB_PASS=dbpass
        volumes:
            - /path/to/credentials.json:/credentials/credentials.json
            - .docker/sqlproxy/proxy-config.yaml:/etc/sqlproxy/proxy-config.yaml
        depends_on:
            - db
            - slave1
            - slave2
        networks:
            - backend

    ####################################################################################################
    # phpMyAdmin
    ####################################################################################################
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - 8080:80
        links:
            - db
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_ARBITRARY: 1
        volumes:
            - .docker/phpmyadmin/sessions:/sessions
        networks:
            - backend

    ####################################################################################################
    # Adminer
    ####################################################################################################
    adminer:
        image: adminer
        ports:
            - 9090:8080
        depends_on:
            - db
        networks:
            - backend

    ####################################################################################################
    # Mailpit
    ####################################################################################################
    mail:
        image: axllent/mailpit:latest
        ports:
            - 8025:8025
            - 1025:1025
        networks:
            - backend

    ####################################################################################################
    # Redis
    ####################################################################################################
    redis:
        image: redis:latest
        command: redis-server --appendonly yes
        volumes:
            - .docker/redis/data:/data
        ports:
            - 6380:6379
        networks:
            - backend
    
    ### Portainer ################################################
    portainer:
      build:
        context: .docker/portainer
      volumes:
        - .docker/portainer/portainer_data:/data
        - /var/run/docker.sock:/var/run/docker.sock
      ports:
        - 9000:9000
      networks:
        - backend

networks:
    frontend:
    backend:
