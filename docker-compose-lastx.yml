services:

    ####################################################################################################
    # PHP
    ####################################################################################################
    php:
        build: .docker/php
        # ports:
        #     - 5173:5173
        volumes:
            - .application:/var/www:cached
        networks:
            - backend
        environment:
            - PHP_FPM_PORT=9000
        # scale: ${PHP_CONTAINERS:-1}
        deploy:
            replicas: 3
            update_config:
                parallelism: 1
            restart_policy:
                condition: on-failure

    ####################################################################################################
    # Nginx
    ####################################################################################################
    nginx:
        image: nginx
        ports:
            - 11001:80
        volumes:
            - .application:/var/www
            - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf

        depends_on:
            - php
        networks:
            - frontend
            - backend

    ####################################################################################################
    # DATABASE (Mariadb) REPLIKA
    ####################################################################################################
    db:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: db_laradoc
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/master:/var/log/mysql/
            - .docker/db/db_master_data:/var/lib/mysql
            - .docker/mysql/master/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/master:/docker-entrypoint-initdb.d
        networks:
            - backend

    slave1:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/slave1:/var/log/mysql
            - .docker/db/db_slave1_data:/var/lib/mysql
            - .docker/mysql/slave1/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/slave1:/docker-entrypoint-initdb.d
        networks:
            - backend
        depends_on:
            - db

    slave2:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/slave2:/var/log/mysql
            - .docker/db/db_slave2_data:/var/lib/mysql
            - .docker/mysql/slave2/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/slave2:/docker-entrypoint-initdb.d
        networks:
            - backend
        depends_on:
            - db


    ####################################################################################################
    # DATABASE (MySQL)
    ####################################################################################################
    # db:
    #     image: mysql:8.1
    #     ports:
    #         - 3307:3306
    #     volumes:
    #         - .docker/db/data:/var/lib/mysql
    #         - .docker/logs:/var/log/mysql
    #         - .docker/db/my.cnf:/etc/mysql/conf.d/my.cnf
    #         - .docker/db/sql:/docker-entrypoint-initdb.d
    #     environment:
    #         MYSQL_ROOT_PASSWORD: root
    #         MYSQL_DATABASE: refactorian
    #         MYSQL_USER: refactorian
    #         MYSQL_PASSWORD: refactorian
    #     networks:
    #         - backend

    ####################################################################################################
    # phpMyAdmin
    ####################################################################################################
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - 8080:80
        links:
            - db
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_ARBITRARY: 1
        volumes:
            - .docker/phpmyadmin/sessions:/sessions
        networks:
            - backend

    ####################################################################################################
    # Adminer
    ####################################################################################################
    adminer:
        image: adminer
        ports:
            - 9090:8080
        depends_on:
            - db
        networks:
            - backend

    ####################################################################################################
    # Mailpit
    ####################################################################################################
    mail:
        image: axllent/mailpit:latest
        ports:
            - 8025:8025
            - 1025:1025
        networks:
            - backend

    ####################################################################################################
    # Redis
    ####################################################################################################
    redis:
        image: redis:latest
        command: redis-server --appendonly yes
        volumes:
            - .docker/redis/data:/data
        ports:
            - 6380:6379
        networks:
            - backend
    
    ### Portainer ################################################
    portainer:
      build:
        context: .docker/portainer
      volumes:
        - .docker/portainer/portainer_data:/data
        - /var/run/docker.sock:/var/run/docker.sock
    #   extra_hosts:
    #     - "dockerhost:${DOCKER_HOST_IP}"
      ports:
        - 9000:9000
      networks:
        - backend

networks:
    frontend:
    backend:


