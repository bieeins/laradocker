    ####################################################################################################
    # Nginx
    ####################################################################################################
    nginx:
        image: nginx
        ports:
            - 80:80
        volumes:
            - .application:/var/www
            - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - php1
            - php2
            - php3
            - php4
            - php5
            - php6
            - php7
            - php8
            - php9
            - php10
        networks:
            - frontend
            - backend

    ####################################################################################################
    # HAProxy
    ####################################################################################################
    # haproxy:
    #     build: .docker/haproxy
    #     ports:
    #         - 8404:8404
