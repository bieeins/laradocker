services:
    ####################################################################################################
    # PHP
    ####################################################################################################
    php1:
        build: .docker/php
        volumes:
            - .application/app1:/var/www:cached
            # - ./docker/php/php.ini:/usr/local/etc/php/php.ini
            # - ./docker/php/docker.conf:/usr/local/etc/php-fpm.d/docker.conf
            # - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
        networks:
            - backend
        environment:
            - PHP_FPM_PORT=9000
            # - PHP_SERVER_NAME=php1
        deploy:
            replicas: 5
            update_config:
                parallelism: 1
            restart_policy:
                condition: on-failure
    php2:
        build: .docker/php
        volumes:
            - .application/app2:/var/www:cached
            # - ./docker/php/php.ini:/usr/local/etc/php/php.ini
            # - ./docker/php/docker.conf:/usr/local/etc/php-fpm.d/docker.conf
            # - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
        networks:
            - backend
        environment:
            - PHP_FPM_PORT=9000
            # - PHP_SERVER_NAME=php1
        deploy:
            replicas: 5
            update_config:
                parallelism: 1
            restart_policy:
                condition: on-failure

    ####################################################################################################
    # Nginx
    ####################################################################################################
    nginx:
        build: .docker/nginx
        # image: nginx
        ports:
            - 80:80
        volumes:
            # - .application:/var/www
            - .docker/nginx/conf.d:/etc/nginx/conf.d/
            - .docker/nginx/nginx.conf:/etc/nginx/nginx.conf
        depends_on:
            - php1
            - php2
        networks:
            - frontend
            - backend

    ####################################################################################################
    # HAProxy
    ####################################################################################################
    # haproxy:
    #     build: .docker/haproxy
    #     ports:
    #         - 8404:8404
    #         - 9000:9000  # Expose HAProxy stats on this port
    #     volumes:
    #         - .docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    #         - /var/run/docker.sock:/var/run/docker.sock
    #     networks:
    #         - frontend
    #         - backend
    #     depends_on:
    #         - php
    #         - db
    #         - slave1
    #         - slave2

    ####################################################################################################
    # DATABASE (Mariadb) REPLIKA
    ####################################################################################################
    db:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: db_laradoc
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/master:/var/log/mysql/
            - .docker/db/db_master_data:/var/lib/mysql
            - .docker/mysql/master/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/master:/docker-entrypoint-initdb.d
        networks:
            - backend

    slave1:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/slave1:/var/log/mysql
            - .docker/db/db_slave1_data:/var/lib/mysql
            - .docker/mysql/slave1/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/slave1:/docker-entrypoint-initdb.d
        networks:
            - backend
        depends_on:
            - db

    slave2:
        image: mariadb:10.11
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_USER: db_user
            MYSQL_PASSWORD: dbpass
        volumes:
            - .docker/logs/slave2:/var/log/mysql
            - .docker/db/db_slave2_data:/var/lib/mysql
            - .docker/mysql/slave2/my.cnf:/etc/mysql/my.cnf
            - .docker/db/sql/slave2:/docker-entrypoint-initdb.d
        networks:
            - backend
        depends_on:
            - db

    ####################################################################################################
    # phpMyAdmin
    ####################################################################################################
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - 8080:80
        links:
            - db
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            PMA_ARBITRARY: 1
        volumes:
            - .docker/phpmyadmin/sessions:/sessions
        networks:
            - backend

    ####################################################################################################
    # Adminer
    ####################################################################################################
    adminer:
        image: adminer
        ports:
            - 9090:8080
        depends_on:
            - db
        networks:
            - backend

    ####################################################################################################
    # Mailpit
    ####################################################################################################
    mail:
        image: axllent/mailpit:latest
        ports:
            - 8025:8025
            - 1025:1025
        networks:
            - backend

    ####################################################################################################
    # Redis
    ####################################################################################################
    redis:
        image: redis:latest
        command: redis-server --appendonly yes
        volumes:
            - .docker/redis/data:/data
        ports:
            - 6380:6379
        networks:
            - backend
    
    ### Portainer ################################################
    # portainer:
    #     build:
    #         context: .docker/portainer
    #     volumes:
    #         - .docker/portainer/portainer_data:/data
    #         - /var/run/docker.sock:/var/run/docker.sock
    #     ports:
    #         - 9080:9000
    #     networks:
    #         - backend

networks:
    frontend:
    backend:
